<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bold View API — reference</title>

  <!-- Swagger UI, vendored locally (no CDN / third-party runtime dependency).
       See docs/api-v1.md "Documentation page". Update by re-downloading
       swagger-ui-dist into vendor/swagger-ui/. -->
  <link rel="stylesheet" href="vendor/swagger-ui/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="vendor/swagger-ui/swagger-ui-bundle.js"></script>
  <script>
    // Single source of truth: the same openapi.yaml that drives the contract.
    // Relative URL keeps it same-origin under /bold-view/ (local) and / (prod),
    // so "Try it out" works without CORS.
    window.ui = SwaggerUIBundle({
      url: 'openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [ SwaggerUIBundle.presets.apis ],
      layout: 'BaseLayout'
    });
  </script>
</body>
</html>
